mde_template: 1
id: iso9001
kind: method
title: ISO 9001
description: "Il sistema di gestione per la qualità come insieme di workflow fatti bene: i processi descritti, ciascuno con chi prepara e chi approva, e le prove che restano in git per l'audit."
version: 2.0.0
requires:
  mde: 2026.10.19.14
languages:
  it: { structure: main, example: esempio }
roles:
  - { role: Responsabile qualità, description: "risponde del sistema qualità: approva i processi e i loro workflow", agents: [iso9001-progettista] }
  - { role: Auditor interno, description: "fa l'audit interno; non controlla i processi di cui risponde", agents: [iso9001-auditor] }
  - { role: Direzione, description: "decide le azioni dopo l'audit e fa il riesame di direzione" }
workflows:
  - .mde-template/iso9001/workflows/processo.md
  - .mde-template/iso9001/workflows/audit.md
instructions: .mde-template/iso9001/istruzioni.md
slides:
  it: .mde-template/iso9001/presentazione.md
theory:
  it: { from: .mde-template/iso9001/teoria, to: teoria/iso9001 }
seeds:
  - { from: .mde-template/iso9001/semi/qualita.md, to: qualita/README.md }
  - { from: .mde-template/iso9001/semi/processi.md, to: qualita/processi.md }
  - { from: .mde-template/iso9001/semi/proposte.md, to: qualita/proposte/README.md }
  - { from: .mde-template/iso9001/semi/audit.md, to: qualita/audit/README.md }
